name: CI

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  REGISTRY: ghcr.io
  RUST_VERSION: 1.81.0

jobs:
  cancel-previous-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

  lint-toml-files:
    needs: cancel-previous-runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Cargo.toml linter
        uses: baptiste0928/cargo-install@v1
        with:
          crate: cargo-toml-lint
          version: "0.1"
      - name: Run Cargo.toml linter
        run: git ls-files | grep Cargo.toml$ | xargs --verbose -n 1 cargo-toml-lint
    #   - name: Notify if Job Fails
    #     uses: ravsamhq/notify-slack-action@v2
    #     if: always() && github.ref == 'refs/heads/master'
    #     with:
    #       status: ${{ job.status }}
    #       token: ${{ secrets.GITHUB_TOKEN }}
    #       notification_title: '{workflow} has {status_message}'
    #       message_format: '{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}> : <{run_url}|View Run Results>'
    #       footer: ''
    #       notify_when: 'failure'
    #     env:
    #       SLACK_WEBHOOK_URL: ${{ secrets.ACTION_MONITORING_SLACK }}

  cargo-fmt-check:
    needs: cancel-previous-runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Check Formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all --verbose -- --check

  cargo-clippy:
    needs: cancel-previous-runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v1
      - name: Check Clippy Linter
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-features --all-targets -- -D warnings

  cargo-check:
    needs: cancel-previous-runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v1
      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --verbose

  cargo-test:
    needs: cancel-previous-runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v1
      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --verbose --all --all-features

  build-and-publish-image:
    needs:
      - lint-toml-files
      - cargo-fmt-check
      - cargo-clippy
      - cargo-check
      - cargo-test
    if: (github.event_name == 'release' && github.event.action == 'published') || github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: FuelLabs/github-actions/.github/workflows/docker-build-push.yml@master
    secrets:
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    with:
      auth-mode: registry-login
      registry: ghcr.io
      build-backend: native
      platforms: linux/amd64,linux/arm64
      runs-on-amd64: ubuntu-latest
      runs-on-arm64: ubuntu-24.04-arm
      dockerfile: deployment/Dockerfile
      docker-context: .
      image: ghcr.io/fuellabs/faucet
      tags: |
        type=ref,event=branch
        type=sha,prefix=
        type=semver,pattern={{raw}}

      # - name: Notify if Job Fails
      #   uses: ravsamhq/notify-slack-action@v2
      #   if: always()
      #   with:
      #     status: ${{ job.status }}
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     notification_title: '{workflow} has {status_message}'
      #     message_format: '{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}> : <{run_url}|View Run Results>'
      #     footer: ''
      #     notify_when: 'failure'
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.ACTION_MONITORING_SLACK }}
